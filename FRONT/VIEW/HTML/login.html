    <script src="../JS/index.js" defer></script>

    <title> LOGIN</title>
</head>

<body>
    <header>
        <section class="section">

            <div class="logo">
                <a href="home.html"><img src="./logo.png" alt="Logo da academia" width="300px" height="200px"
                        margin-bottom=10px></a>
            </div>

            <nav class="nav">
                <ul>
                    <li><a style="color: red;" href="../../../index.html">HOME</a></li>
                    <li><a href="../../../index.html">SOBRE</a></li>

                </ul>
            </nav>

            <div class="menu-hamburguer" id="menuHamburguer">

                </a>
            </div>

        </section>
    </header>

    <main class="conteudo">
        <section id="formulario">

            <form id="formLogin">

                <legend>
                    <i class="fa-regular fa-user"></i>
                    Dados
                </legend>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>

                <div class="login-link">
                    <a href="./cadastroUser.html">Não possui uma conta? Faça o cadastro</a>
                </div>

                <button id="btnLogar" type="submit">
                    Logar
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

        </section>
    </main>
