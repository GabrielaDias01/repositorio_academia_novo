<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Esta metated descreve o resumo do conteúdo da página">
    <meta name="keywords" content="metatags, SEO, acessibilidade, mecanismos de busca, html">
    <meta name="author" content="Gabriela de Almeida Dias">
    <meta name="language" content="pt-br">

    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/reset.css">
    <link rel="stylesheet" href="../CSS/principal.css">
    <link rel="stylesheet" href="../CSS/grid.css">
    <link rel="stylesheet" href="../CSS/componentes.css">
    <link rel="stylesheet" href="../CSS/mensagens.css">
    <link rel="stylesheet" href="../CSS/cadastro.css">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="../../CONTROLLER_VIEW/api.js" defer></script>
    <script src="../../CONTROLLER_VIEW/excluir_usuario.js" defer></script>
    <script src="../../CONTROLLER_VIEW/consultar_usuario.js" defer></script>
    <script src="../../CONTROLLER_VIEW/tabela-view.js" defer></script>
    <script src="../../CONTROLLER_VIEW/salvar_usuario.js" defer></script>
    <script src="../../CONTROLLER_VIEW/cadastrar_usuario.js" defer></script>
    <script src="../../CONTROLLER_VIEW/atualizar_usuario.js" defer></script>

</head>

<body>

    <!-- MENU -->

    <header>
        <section class="section">

            <div class="logo">
                <a href="../../../index.html">
                    <img src="logo.png" alt="Logo da academia" width="300" height="200">
                </a>
            </div>

            <nav class="nav">
                <ul>
                    <li><a style="color:red;" href="../../../index.html">HOME</a></li>
                    <li><a href="../../../index.html">SOBRE</a></li>
                    <li><a href="../../../index.html">PLANOS</a></li>
                    <li><a href="../../../index.html">CONTATOS</a></li>
                    <li><a href="./iaTreino.html">TREINO COM IA</a></li>
                    <li><a href="./iaPesquisa.html">IA IMAGEM</a></li>
                </ul>
            </nav>

            <div class="menu-hamburguer" id="menuHamburguer">
                ☰
            </div>

            <div class="icone">
                <a href="./perfil.html" class="btn-icone">
                    <img src="https://img.icons8.com/?size=100&id=uOoIUTYvxnso&format=png&color=000000" alt="Cadastro">
                </a>
            </div>
        </section>
    </header>
    <!-- TABELA -->

    <section class="area-tabela">

        <div class="caixa">

            <h2 class="titulo-h2">Lista de Usuários</h2>

            <div class="row">

                <div class="col-8"></div>

                <div class="col-4 botoes-topo">

                    <button id="btnCadastrarUsuario" type="button" class="btn btn-info">
                        Cadastrar Usuário
                    </button>

                    <button id="btnConsultarUsuario" type="button" class="btn btn-info">
                        Consultar Usuários
                    </button>

                </div>

            </div>

            <table id="tabela-usuarios">

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </section>

    <!-- FORMULÁRIO -->

    <section class="container area-cadastro">

        <header class="titulo">
            <h1>Cadastro</h1>
            <p>Insira as informações solicitadas</p>
        </header>

        <section id="formulario">

            <form id="frmUsuario">

                <fieldset>

                    <legend>
                        <i class="fa-regular fa-user"></i>
                        Dados
                    </legend>

                    <div id="divMensagens"></div>

                    <div class="input-box">
                        <i class="fa-regular fa-user"></i>

                        <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo">
                    </div>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" name="email" id="email" placeholder="seu@email.com">
                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" name="senha" id="senha" placeholder="Digite sua senha">

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" name="confirmarSenha" id="confirmarSenha"
                            placeholder="Confirme sua senha">

                    </div>

                </fieldset>

                <button type="submit" id="btnCadastrar">
                    Cadastrar
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

        </section>

    </section>

    <!-- Modal Alterar Aluno -->
    <div id="modalAlterar" class="modal">

        <div class="modal-content">

            <h2>Alterar Usuário</h2>

            <input type="hidden" id="idUsuario">

            <div class="row">

                <div class="col-12">
                    <label>Nome</label>
                    <input type="text" id="txtNomeAlterar" class="caixa-texto">
                </div>

            </div>

            <div class="row">

                <div class="col-6">
                    <label>Email</label>
                    <input type="text" id="txtEmailAlterar" class="caixa-texto">
                </div>

                <div class="col-6">
                    <label>Senha</label>
                    <input type="password" id="txtSenhaAlterar" class="caixa-texto">
                </div>

                <div class="col-6">
                    <label>Confirmar Senha</label>
                    <input type="password" id="txtConfirmarSenhaAlterar" class="caixa-texto">
                </div>
            </div>


            <div class="row">

                <div class="col-6">
                    <button type="button" id="btnCancelarAlteracao" class="btn btn-danger">

                        Cancelar

                    </button>
                </div>

                <div class="col-6">
                    <button type="button" id="btnSalvarAlteracao" class="btn btn-info">

                        Salvar

                    </button>
                </div>

            </div>

        </div>

    </div>

    <script src="../JS/index.js"></script>
</body>

</html>
